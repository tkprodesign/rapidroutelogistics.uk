name: Download server files to repository

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ftp-download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install FTP sync tool
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Download all server files into repo
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          REMOTE_DIR: /rapidroutelogistics.uk/htdocs
        run: |
          set -euo pipefail

          echo "Downloading all files from $REMOTE_DIR into the repository workspace..."
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" <<LFTP_COMMANDS
          set ftp:ssl-allow no
          set net:max-retries 3
          set net:timeout 20
          mirror --verbose --parallel=4 \
            --exclude-glob .git/ \
            --exclude-glob .github/ \
            "$REMOTE_DIR" .
          bye
          LFTP_COMMANDS

          echo "Downloaded files now present in workspace:"
          find . -path ./.git -prune -o -type f -print | sort | sed 's#^./##'

      - name: Commit downloaded server files
        run: |
          set -euo pipefail

          git add -A
          git status --short

          if git diff --cached --quiet; then
            echo "No server file changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Download server files into repo"
          git push
